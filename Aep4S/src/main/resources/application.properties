spring.application.name=horta-comunitaria
server.address=${HORTA_HOST:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${HORTA_DB_URL:jdbc:postgresql://localhost:5432/horta_comunitaria}
spring.datasource.username=${HORTA_DB_USER:postgres}
spring.datasource.password=${HORTA_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
